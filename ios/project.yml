# Graph89 Remastered for iPhone: the Xcode project, generated with XcodeGen (brew install xcodegen; cd ios; xcodegen).
# The emulator cores are the Android app's C sources (app/src/main/jni), one static library per module of the Android
# build: see core-targets.yml (generated by scripts/gen_core_targets.py).
name: Graph89

include:
  - core-targets.yml

options:
  bundleIdPrefix: app.graph89remaster
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # the cores are old C: what the Android build allows, plus what newer clang made errors by default
    # -fgnu89-inline: glib's extern inline helpers get one definition (in gutils.c), not one per file;
    # -funsigned-char: char is unsigned on Android's ARM builds, which the cores were tested on
    G89_CORE_CFLAGS: >-
      -fgnu89-inline -funsigned-char
      -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion
      -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types -Wno-error=return-type
      -Wno-error=format-security -Wno-expansion-to-defined -Wno-compound-token-split-by-macro

targets:
  Graph89:
    type: application
    platform: iOS
    sources:
      - path: Graph89
      # the Android app's assets as they are: skin layouts, pre-rendered skins, fonts, licences
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    dependencies:
      - target: G89Wrapper
      - target: G89TilEm
      - target: G89TiEmu
      - target: G89TiCalcs
      - target: G89TiFiles
      - target: G89TiCables
      - target: G89TiConv
      - target: G89GLib
      - sdk: libz.tbd
      - sdk: libiconv.tbd
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Graph89
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        # GPL: the About screen links to the source code
        G89SourceURL: https://github.com/jameskho512/graph89-remastered-ios
    settings:
      base:
        PRODUCT_NAME: Graph89
        PRODUCT_BUNDLE_IDENTIFIER: app.graph89remaster
        SWIFT_OBJC_BRIDGING_HEADER: Graph89/Support/Graph89-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Graph89Core/include"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO

  Graph89Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Graph89Tests]
    dependencies:
      - target: Graph89
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.graph89remaster.tests
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Graph89Core/include"]

  Graph89UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Graph89UITests]
    dependencies:
      - target: Graph89
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.graph89remaster.uitests

schemes:
  Graph89:
    build:
      targets:
        Graph89: all
        Graph89Tests: [test]
        Graph89UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: Graph89Tests
        - name: Graph89UITests
    archive:
      config: Release
